[package]
name = "bevy-axes-gizmo"
description = "A tiny Bevy plugin for an axes gizmo."
version = "0.4.0"
repository = "https://github.com/maximsnoep/bevy-axes-gizmo"
authors = ["Snoep <maxim@snoep.io>"]
keywords = ["bevy", "gizmo", "plugin"]
edition = "2024"
license = "MIT"
exclude = ["assets"]

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["bevy_pbr"] }

[dev-dependencies]
bevy = { version = "0.20.0", features = ["bevy_ui"] }
